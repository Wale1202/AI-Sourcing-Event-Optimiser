server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: anything that doesn't match a real file serves index.html so
  # React Router can take over client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed assets; never cache the entry HTML.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
